version: 2

# Monthly and grouped: one PR per ecosystem per month instead of a pile of one-offs.
# Security updates still open immediately regardless of this schedule.
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Held: 2.27+ pulls jsdom 27+, whose ESM-only deps (@exodus/bytes, parse5 8, entities 8)
      # break Jest (CommonJS). The app itself runs fine on Node 24. 2.26.x has no open advisories.
      # Revisit when the backend tests move to ESM/vitest. See docs/revival-plan.md.
      - dependency-name: isomorphic-dompurify
        versions: [">=2.27.0"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @docusaurus/* must all share one exact version; bump them together by hand.
      - dependency-name: "@docusaurus/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
